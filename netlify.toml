[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Stable public address for the capability statement PDF.
[[redirects]]
  from = "/capability-statement"
  to = "/files/actura-health-capability-statement.pdf"
  status = 302

# Launched 2026-10-25: indexing on (PUBLIC_INDEXABLE=true in the Netlify environment).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
